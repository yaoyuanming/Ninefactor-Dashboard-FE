server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # 前端静态文件根目录（对应容器内路径）
    root /usr/share/nginx/html;
    index index.html;

    # ========== 核心：解决 SPA 路由刷新 404 ==========
    location / {
        try_files $uri $uri/ /index.html;  # 所有路由找不到时指向 index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate";  # 入口文件不缓存
        add_header Pragma no-cache;
        add_header Expires 0;
    }

    # ========== 静态资源缓存策略（优化加载速度） ==========
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;  # 静态资源缓存 7 天
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin *;  # 静态资源允许跨域（可选）
    }

    # ========== 反向代理后端接口（如果需要，避免浏览器跨域） ==========
    # 示例：代理后端 API 接口
    # location /admin-api/ {
    #     proxy_pass ${VITE_BASE_URL}/admin-api/;  # 也可通过环境变量动态配置
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_connect_timeout 60s;
    #     proxy_send_timeout 60s;
    #     proxy_read_timeout 60s;
    # }

    # ========== 客户端超时配置（避免请求中断） ==========
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 60s;

    # ========== 日志配置（输出到容器标准输出，方便 K8s 收集） ==========
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # ========== 错误页面 ==========
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
